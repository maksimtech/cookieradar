<!doctype html>
<!--
  Not a site's banner. An "Accetta" with nothing around it that says where the
  banner begins: no dialog role, no id or class naming cookies, consent or a
  platform. Whatever else the page holds cannot be told apart from the banner,
  so nothing is counted — and an uncounted banner is no evidence of a single
  choice.
-->
<html lang="it">
<head><meta charset="utf-8"><title>Un pulsante senza contenitore</title></head>
<body>
<div class="box">
  <p>Usiamo cookie di profilazione.</p>
  <button type="button" onclick="document.cookie='clicked=accetta'">Accetta</button>
</div>
</body>
</html>
