<!doctype html>
<!--
  The cookie banner https://www.inps.it/ served on 2026-11-27 to the scanner's
  Chromium (locale it-IT): "Accetta Tutti" (#acceptAllBtn), "Rifiuta i cookie non
  tecnici" (#refuseAnalyticsBtn) and "Impostazioni dei cookie" (#settingCookieBtn).
  No id the scanner knows, so the refusal is reached by its label or not at all
  (#97). Each button records which one was clicked in a cookie.
-->
<html lang="it">
<head><meta charset="utf-8"><title>INPS</title></head>
<body>
<h1>Istituto Nazionale Previdenza Sociale</h1>
<div id="cookieBanner" class="cookiebar">
  <p>Questo sito utilizza cookie tecnici e, previo consenso, cookie analitici.</p>
  <a href="#modalimpostazionicookies">Impostazioni dei cookie</a>
  <button id="acceptAllBtn" onclick="document.cookie='clicked=accept-all'">Accetta Tutti</button>
  <button id="refuseAnalyticsBtn" onclick="document.cookie='clicked=refuse-analytics'">Rifiuta i cookie non tecnici</button>
  <button id="settingCookieBtn" onclick="document.cookie='clicked=settings'">Impostazioni dei cookie</button>
</div>
</body>
</html>
