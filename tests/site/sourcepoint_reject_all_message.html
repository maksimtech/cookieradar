<!doctype html>
<!--
  Inside the iframe of sourcepoint_reject_all.html, derived from the message of
  theguardian.com on 2026-11-27 with "Reject all" in place of "Reject all and
  subscribe". Each button records which one was clicked in a cookie.
-->
<html lang="en">
<head><meta charset="utf-8"><title>SP Consent Message</title></head>
<body>
<div class="message-container">
  <p>We use cookies and similar technologies.</p>
  <button class="message-component message-button" onclick="document.cookie='clicked=accept-all'">Accept all</button>
  <button class="message-component message-button" onclick="document.cookie='clicked=reject-all'">Reject all</button>
</div>
</body>
</html>
