<!doctype html>
<html><head><title>waiting for the service worker</title></head><body>
<p>A page whose service worker fetches on its own.</p>
<script>
// The title says whether the worker answered: the scanner records it.
const controlled = new Promise(resolve => {
  if (navigator.serviceWorker.controller) resolve();
  navigator.serviceWorker.addEventListener('controllerchange', resolve);
});
navigator.serviceWorker.register('sw.js');
controlled
  .then(() => fetch('through-sw'))
  .then(r => r.text())
  .then(t => { document.title = t; });
</script>
</body></html>
