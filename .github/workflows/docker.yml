name: Build and Push Docker Image
# Not triggered by tags directly: publish.yml calls this workflow after the
# PyPI upload, so the image never races with the package it installs.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09.4)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Already published version to rebuild (e.g. v2026.09.4)'
        required: true
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version
        id: version
        env:
          RAW: ${{ inputs.version }}
        run: |
          echo "VERSION=v${RAW#v}" >> "$GITHUB_OUTPUT"
          echo "PIP_VERSION=${RAW#v}" >> "$GITHUB_OUTPUT"
      - name: Wait for cookieradar on PyPI
        env:
          PIP_VERSION: ${{ steps.version.outputs.PIP_VERSION }}
        run: bash .github/scripts/wait_for_pypi.sh cookieradar "$PIP_VERSION"
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cookieradar:smoke
          build-args: |
            COOKIERADAR_SOURCE=pypi
            COOKIERADAR_VERSION=${{ steps.version.outputs.PIP_VERSION }}
      - name: Smoke test (Chromium launches as non-root user, version matches)
        env:
          PIP_VERSION: ${{ steps.version.outputs.PIP_VERSION }}
        run: docker run --rm -i -e EXPECTED_VERSION="$PIP_VERSION" --entrypoint python cookieradar:smoke - < tests/docker/smoke.py
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/cookieradar:latest
            maksimtech/cookieradar:${{ steps.version.outputs.VERSION }}
          build-args: |
            COOKIERADAR_SOURCE=pypi
            COOKIERADAR_VERSION=${{ steps.version.outputs.PIP_VERSION }}
