name: Build and Push Docker Image
# Not triggered by tags directly: publish.yml calls this workflow after the PyPI
# upload. It used to have to — the image installed the package from the index, so it
# raced with the upload running beside it — and the sequencing is kept because the
# version it is handed is the one that was published. The race itself is gone: the
# image is built from the tag's source and asks the index nothing about this package.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09.4)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Already published version to rebuild (e.g. v2026.09.4)'
        required: true
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-26.04
    steps:
      # The tag being built, not the default branch. The image is built from this
      # checkout now, so where the job stands decides what ships. `version` is a
      # required input of both triggers, so there is no case where it is absent.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version
        id: version
        env:
          RAW: ${{ inputs.version }}
        run: |
          echo "VERSION=v${RAW#v}" >> "$GITHUB_OUTPUT"
          echo "PIP_VERSION=${RAW#v}" >> "$GITHUB_OUTPUT"
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cookieradar:smoke
          build-args: |
            COOKIERADAR_SOURCE=local
      - name: Smoke test (Chromium launches as non-root user, version matches)
        env:
          PIP_VERSION: ${{ steps.version.outputs.PIP_VERSION }}
        run: docker run --rm -i -e EXPECTED_VERSION="$PIP_VERSION" --entrypoint python cookieradar:smoke - < tests/docker/smoke.py
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/cookieradar:latest
            maksimtech/cookieradar:${{ steps.version.outputs.VERSION }}
          build-args: |
            COOKIERADAR_SOURCE=local
