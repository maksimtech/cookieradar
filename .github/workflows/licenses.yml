name: License Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  licenses:
    name: License Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e .  # NOSONAR
          pip install pip-licenses
      - name: Check licenses
        run: |
          pip-licenses \
            --order=license \
            --format=markdown \
            --output-file=licenses.md
          cat licenses.md
      # --partial-match, because without it --fail-on compares whole licence
      # strings and no package declares just "GPL": they declare "GNU Lesser
      # General Public License v2 or later (LGPLv2+)" and the like. Measured on
      # 2026-10-11 with chardet 5.2.0 installed next to cookieradar: exit 0
      # without the flag, exit 1 with it. The gate had never refused anything.
      - name: Fail on forbidden licenses
        run: |
          pip-licenses --fail-on="GPL;AGPL;LGPL" --partial-match
