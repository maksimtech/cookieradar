name: License Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  licenses:
    name: License Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e .  # NOSONAR
          pip install pip-licenses
      - name: Check licenses
        run: |
          pip-licenses \
            --order=license \
            --format=markdown \
            --output-file=licenses.md
          cat licenses.md
      - name: Fail on forbidden licenses
        run: |
          pip-licenses --fail-on="GPL;AGPL;LGPL"
