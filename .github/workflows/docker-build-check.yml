name: Docker Build Check
# Builds the image from the repository source and runs the smoke test without
# pushing anything. docker.yml cannot serve this purpose: it publishes to
# Docker Hub, including the :latest tag, so it is only safe to run on a
# released version.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Before the build, so the pull of the base image counts against this
      # account and not against the runner address's anonymous allowance, which
      # ran out on 2026-10-09 (429 on python:3.12-slim-trixie). continue-on-error:
      # a fork has no secrets and still has to build.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image from source
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: cookieradar:build-check
          build-args: |
            COOKIERADAR_SOURCE=local
      - name: Smoke test (Chromium launches as the container user)
        run: docker run --rm -i --entrypoint python cookieradar:build-check - < tests/docker/smoke.py

      # What the image contains, read from the image itself. This is the only place
      # it can be read: Docker Desktop will not install on the machine this is
      # developed on, where Windows 10 IoT Enterprise LTSC 2021 is build 19044 and
      # Docker requires 19045 — a build that edition never receives. A Linux runner
      # is the truer place for the question anyway.
      #
      # See tests/docker/inspect.sh for why it matters here in particular: every
      # package version in SECURITY-EXCEPTIONS.toml was copied from Snyk's report
      # rather than measured, and this image ships the build tooling that the other
      # Radar remove.
      - name: What the image contains
        run: docker run --rm -i --entrypoint sh cookieradar:build-check - < tests/docker/inspect.sh
