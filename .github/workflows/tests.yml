name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    # id-token: write lets the coverage upload prove to Codecov, through GitHub's
    # OIDC, which repository it comes from. Job permissions replace the workflow's,
    # so contents: read is repeated here.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the classifiers in pyproject.toml (checked by tests)
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          # The next release, before the classifier promises it: 3.16 goes final
          # in October 2027 (PEP 602's yearly cadence) and setup-python resolves
          # `3.16-dev` to the newest build. It may fail without failing the run:
          # continue-on-error reports the job as succeeded to `summary`, so
          # "Tests" stays green, and the ruleset never requires this row.
          - python-version: "3.16-dev"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[test]"  # NOSONAR
      - name: Install Chromium for integration tests
        run: playwright install --with-deps chromium
      - name: Run tests with coverage
        run: pytest tests/ --ignore=tests/benchmarks --cov=cookieradar --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Once, not once per matrix entry: the same report four times is four
        # uploads of one measurement. 3.12 is in every Radar's matrix.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # OIDC, not a CODECOV_TOKEN secret: Codecov files an upload under the
          # project its token belongs to, and this repository's secret held
          # exeradar's, so the reports went there (tests/test_codecov_contract.py).
          use_oidc: true
          files: coverage.xml
          # A failed upload loses a metric; it does not invalidate the tests that
          # just passed. What it must not do is stay silent forever — ask Codecov
          # whether the report arrived.
          fail_ci_if_error: false
  docker:
    name: Docker image (local source)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image from local source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: cookieradar:ci
          build-args: |
            COOKIERADAR_SOURCE=local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (Chromium launches as non-root user, version matches repo)
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('cookieradar/__init__.py').read()).group(1))")
          docker run --rm -i -e EXPECTED_VERSION="$VERSION" --entrypoint python cookieradar:ci - < tests/docker/smoke.py
  summary:
    # The branch ruleset requires a check named exactly "Tests".
    # always(): a skipped required check counts as passed, so this job must
    # run even when a needed job fails, and fail explicitly in that case.
    name: Tests
    needs: [test, docker]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: All test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required test job ended with: $result"; exit 1; }
          done
