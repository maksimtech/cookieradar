name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the classifiers in pyproject.toml (checked by tests)
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[test]"  # NOSONAR
      - name: Install Chromium for integration tests
        run: playwright install --with-deps chromium
      - name: Run tests with coverage
        run: pytest tests/ --ignore=tests/benchmarks --cov=cookieradar --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Once, not once per matrix entry: the same report four times is four
        # uploads of one measurement. 3.12 is in every Radar's matrix.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # A failed upload loses a metric; it does not invalidate the tests that
          # just passed. What it must not do is stay silent forever — ask Codecov
          # whether the report arrived.
          fail_ci_if_error: false
  docker:
    name: Docker image (local source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image from local source
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cookieradar:ci
          build-args: |
            COOKIERADAR_SOURCE=local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (Chromium launches as non-root user, version matches repo)
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('cookieradar/__init__.py').read()).group(1))")
          docker run --rm -i -e EXPECTED_VERSION="$VERSION" --entrypoint python cookieradar:ci - < tests/docker/smoke.py
  summary:
    # The branch ruleset requires a check named exactly "Tests".
    # always(): a skipped required check counts as passed, so this job must
    # run even when a needed job fails, and fail explicitly in that case.
    name: Tests
    needs: [test, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required test job ended with: $result"; exit 1; }
          done
