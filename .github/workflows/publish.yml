name: Publish to PyPI
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/cookieradar
    permissions:
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read package version
        id: version
        run: |
          VERSION=$(python -c "from cookieradar import __version__; print(__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: pip install --upgrade build hatchling  # NOSONAR
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: false
      # That the file on PyPI can be installed used to be proved by accident, by the
      # image installing it. The image now builds from the tag's source and never asks
      # the index, so the check is made here, on purpose, and after the upload — where
      # a slow index delays a check instead of failing a build that had nothing to do
      # with it.
      #
      # No margin: the grace in that script exists for the case of two resolvers, the
      # runner and the buildx container. Here there is only the runner, which is what
      # the poll just asked, so a margin would buy nothing.
      - name: Wait for the index to catch up
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/wait_for_pypi.sh cookieradar "$VERSION" 30 20 0

      - name: Check the published wheel installs and runs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "${RUNNER_TEMP}/verify"
          "${RUNNER_TEMP}/verify/bin/pip" install --no-cache-dir "cookieradar==${VERSION}"
          "${RUNNER_TEMP}/verify/bin/cookieradar" --version
  docker:
    name: Docker image
    # Runs only after the package is on PyPI. The image no longer installs it from
    # there — it is built from the tag's source — but the version handed to it is the
    # one this job published, so the order still means something.
    needs: build-and-publish
    permissions:
      contents: read
    uses: ./.github/workflows/docker.yml
    with:
      version: v${{ needs.build-and-publish.outputs.version }}
    secrets: inherit
