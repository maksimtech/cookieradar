# ─────────────────────────────────────────────────────────────────────────────
# Debian 13 (trixie) packages of the base image, shared with the other four
# Radar. Two different cases, which every scanner prints identically:
#
#   zlib, perl   open in bookworm, trixie, sid and forky alike, nothing
#                scheduled anywhere. Waiting is not a plan; the Debian bug is
#                where evidence goes.
#   attr, acl    already fixed in unstable, filed no-dsa for trixie *because the
#                fix comes in a point release*. That waiting ends at a dated
#                event: rebuild after it.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-85091"
source = "Docker Scout"
where = "zlib 1:1.3.dfsg+really1.3.1-1, python slim-trixie base image"
why = """
Debian reports no fixed version in any suite — open in bookworm, trixie, sid and \
forky, urgency not yet assigned, Debian bug 1146895. There is nothing to wait \
for and nothing to ask for; what moves a flaw in this state is evidence on that \
bug.

An out-of-bounds write reached through gzprintf. cookieradar reaches zlib \
through Python's own module and through Chromium's handling of compressed \
responses from the sites it audits — which is the one place in the five Radar \
where the input is genuinely third-party. That is a reason for the short review \
habit, not for holding a release Debian cannot end.
"""
review_by = "2026-12-31"

[[exception]]
