# ─────────────────────────────────────────────────────────────────────────────
# gnutls28 and krb5, reported by Docker Scout on 2026-10-09 against 2026.43, five
# ids and no Snyk twin. Neither library is in python:3.12-slim-trixie: both come
# in with `playwright install-deps chromium`, as dependencies of libcups2t64,
# which Chromium wants for printing. Measured in maksimtech/cookieradar:latest
# the same day: `apt-cache rdepends --installed` names libcups2t64 as the only
# package depending on libgnutls30t64 and on libgssapi-krb5-2, nothing depends
# on libcups2t64, and libcups.so.2 is the only ELF file in the image whose `ldd`
# reaches either library.
#
# Playwright 1.63.0 ships two Chromium builds (chromium-1243). The full `chrome`
# links libcups.so.2 and so loads gnutls and krb5 at start; `chrome-headless-
# shell` does not link cups at all. cookieradar calls
# `p.chromium.launch(headless=headless)` with no channel, and headless — the
# default, and the only mode that runs in the image, which has no display — is
# the headless shell: launched inside the image, the process is
# chrome-headless-shell and its /proc maps hold none of libgnutls, libkrb5,
# libgssapi or libcups. Both binaries carry the string `libgssapi_krb5` once:
# Chromium's HTTP Negotiate code dlopen()s it only when a server answers 401
# with `WWW-Authenticate: Negotiate`, and cookieradar authenticates to nothing.
#
# TLS in this image does not go through gnutls. httpx reaches Python's `_ssl`,
# which `ldd` shows on libssl.so.3 (OpenSSL 3.5.7); Chromium carries BoringSSL
# statically and exports no gnutls_ symbol. Kerberos is used by nothing.
#
# Debian, read with `patchradar debian` on 2026-10-09: all five open in trixie,
# urgency not yet assigned, no fixed version in any suite, no no-dsa and no
# Debian bug. The tracker's own note on the gnutls ids is "check if <gist>
# reported upstream, valid?" — Debian has not confirmed them yet.
#
# Checked on 2026-10-10, so that note is answered here rather than guessed at.
# Valid: all five gnutls ids (and CVE-2026-88648, same batch, not reported by
# Scout against this image) reproduce with the researcher's public PEM files
# (https://github.com/lkloliver/poc) against the Debian packages themselves —
# gnutls-bin 3.8.9-3+deb13u4 in debian:trixie-slim and 3.8.13-1 in
# debian:sid-slim, certtool / gnutls-cli / gnutls-serv only, no PoC script run,
# negative controls behaving as expected; transcripts kept outside the repo.
# Reported upstream: no GnuTLS GitLab issue existed for any of them, no
# gnutls-devel or oss-security post, Red Hat bugzilla entries (2548057, 2548190)
# auto-imported and NEW, SUSE "pending". So both halves of Debian's question
# were answered the same day, 2026-10-10: reported to GnuTLS as confidential
# issue 1965 (https://gitlab.com/gnutls/gnutls/-/issues/1965, visible to
# project members only until they lift it), and filed as Debian bug 1150522
# against src:gnutls28 (severity important, tags security upstream, found in
# 3.8.13-1 and 3.8.9-3+deb13u4, forwarded to team@security.debian.org and the
# GnuTLS maintainers) with the transcripts attached. krb5 moved on the same
# day: see its entry. Reviewed with the other Chromium dependencies on
# 2026-11-30, or earlier if either report moves.
# ─────────────────────────────────────────────────────────────────────────────

# Reviewed 2026-11-17: the gnutls entries were removed. Debian rates
# CVE-2026-95210, -88647, -95184 and -67693 unimportant, not security issues
# under GnuTLS's own policy (bug 1150522), and CVE-2026-95209 was rejected by
# its CNA on 2026-10-08. Docker Scout closed all five on 2026-10-15.

[[exception]]
id = "CVE-2026-107778"
source = "Docker Scout"
where = "krb5 / libkrb5-3, libgssapi-krb5-2, libkrb5support0 1.21.3-5+deb13u1, Chromium dependency via libcups2t64"
why = """
MIT krb5 through 1.22.2: a NULL pointer dereference in make_cred_list() in \
rd_cred.c lets an authenticated Kerberos client crash a GSS-API *acceptor* by \
forwarding credentials with more tickets than ticket_info entries through \
gss_accept_sec_context() (NVD; fixed upstream in krb5 PR 1511, master). \
`patchradar debian` on 2026-10-09: open in trixie at 1.21.3-5+deb13u1, no fix \
in any suite, no no-dsa, no Debian bug. On 2026-10-10 the picture changed: \
Debian bug 1150461 (filed by the security team on 2026-10-09, together with \
CVE-2026-107708), trixie marked no-dsa "Minor issue", and the fix is on the \
upstream krb5-1.22 branch as commit 62196e2b (not yet in a release — 1.22.2 \
is the latest). Nothing to ask for: the request already exists and has a \
patch attached. In this image libgssapi-krb5-2 is \
required only by libcups2t64 and loaded only by Playwright's full `chrome`, not \
by the chrome-headless-shell cookieradar runs; Chromium would dlopen() it for \
HTTP Negotiate only on a 401 with `WWW-Authenticate: Negotiate`, as an \
initiator and never as the acceptor the flaw is in. cookieradar authenticates \
to nothing and no service in the image accepts Kerberos. Measured in \
maksimtech/cookieradar:latest (2026.43) on 2026-10-09.

Since 2026-10-11T17:07:25Z Docker Scout has stopped reporting it, which is why \
the gate lists this entry as settled. It is kept, and the reason is not how long \
the silence has lasted: `patchradar debian CVE-2026-107778` on 2026-10-15 still \
reports krb5 no-dsa in trixie at 1.21.3-5+deb13u1, no fix in any suite, Debian \
bug 1150461. The package named in `where` is still unfixed in trixie and only \
the reporting changed. Deleting a flaw that is demonstrably present because a \
scanner fell silent is the one direction this file must not drift in.

Reviewed 2026-11-17: no-dsa for trixie and unfixed in sid (Debian bug \
1150461). Docker Scout has not reported it since 2026-10-11, but the package \
in the image is unchanged, so the entry stays in case it comes back.
"""
review_by = "2026-12-31"

