# ─────────────────────────────────────────────────────────────────────────────
# gnutls28 and krb5, reported by Docker Scout on 2026-10-09 against 2026.43, five
# ids and no Snyk twin. Neither library is in python:3.12-slim-trixie: both come
# in with `playwright install-deps chromium`, as dependencies of libcups2t64,
# which Chromium wants for printing. Measured in maksimtech/cookieradar:latest
# the same day: `apt-cache rdepends --installed` names libcups2t64 as the only
# package depending on libgnutls30t64 and on libgssapi-krb5-2, nothing depends
# on libcups2t64, and libcups.so.2 is the only ELF file in the image whose `ldd`
# reaches either library.
#
# Playwright 1.63.0 ships two Chromium builds (chromium-1243). The full `chrome`
# links libcups.so.2 and so loads gnutls and krb5 at start; `chrome-headless-
# shell` does not link cups at all. cookieradar calls
# `p.chromium.launch(headless=headless)` with no channel, and headless — the
# default, and the only mode that runs in the image, which has no display — is
# the headless shell: launched inside the image, the process is
# chrome-headless-shell and its /proc maps hold none of libgnutls, libkrb5,
# libgssapi or libcups. Both binaries carry the string `libgssapi_krb5` once:
# Chromium's HTTP Negotiate code dlopen()s it only when a server answers 401
# with `WWW-Authenticate: Negotiate`, and cookieradar authenticates to nothing.
#
# TLS in this image does not go through gnutls. httpx reaches Python's `_ssl`,
# which `ldd` shows on libssl.so.3 (OpenSSL 3.5.7); Chromium carries BoringSSL
# statically and exports no gnutls_ symbol. Kerberos is used by nothing.
#
# Debian, read with `patchradar debian` on 2026-10-09: all five open in trixie,
# urgency not yet assigned, no fixed version in any suite, no no-dsa and no
# Debian bug. The tracker's own note on the four gnutls ids is still "TODO:
# check if <gist> reported upstream, valid?" — Debian has not confirmed them
# yet. Nothing to wait for and nothing to ask for; evidence goes on the tracker
# pages. Reviewed with the other Chromium dependencies on 2026-11-30.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-95210"
source = "Docker Scout"
where = "gnutls28 / libgnutls30t64 3.8.9-3+deb13u4, Chromium dependency via libcups2t64"
why = """
Improper certificate validation in gnutls 3.8.13: an application that verifies a \
chain with it accepts certificates containing invalid extensions (NVD; Scout \
rates it critical). `patchradar debian` on 2026-10-09: open in trixie at \
3.8.9-3+deb13u4, no fix in any suite, no no-dsa, no Debian bug, tracker note \
"TODO: check if reported upstream, valid?". In this image libgnutls30t64 is \
required only by libcups2t64 and loaded only by Playwright's full `chrome`, not \
by the chrome-headless-shell cookieradar runs; no TLS here is gnutls — httpx \
uses OpenSSL through Python's `_ssl`, Chromium its own BoringSSL. Measured in \
maksimtech/cookieradar:latest (2026.43) on 2026-10-09.
"""
