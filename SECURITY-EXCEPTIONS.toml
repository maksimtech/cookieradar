# ─────────────────────────────────────────────────────────────────────────────
# CodeQL `py/incomplete-url-substring-sanitization`, eight alerts across two test
# files. Read line by line on 2026-09-29 before being written down.
#
# The rule fires on `"something.tld" in text`, on the assumption that a hostname
# literal tested with `in` is a URL being checked. Here the right side is either
# CLI output cookieradar just produced or the built-in TRACKER_DOMAINS list, and
# the left side is a domain expected to be there.
#
# This repository is the one where the rule would be worth taking seriously, and
# so the code was checked and not assumed: scanner.py:237 matches a host against
# a tracker domain as `host == domain or host.endswith("." + domain)`, and
# scanner.py:88 compares two hosts the same way. `notfacebook.com` therefore does
# not count as `facebook.com`, and `facebook.com.evil.net` does not either. Had
# the production match been a substring test, these alerts would have been a fix
# and not an entry — an audit tool that mislabels a domain is worse than one that
# does not run.
#
# An entry here is scoped to its file, so a genuine occurrence of this rule
# anywhere else still fails the build.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/test_cli.py"
where = "test_cli.py:54, 55, 80, 444, 637 — assertions on CLI output"
why = """
Five assertions that a domain does, or does not, appear in the violation section \
of what the CLI printed — including the negative one, `assert \
"a.doubleclick.net" not in ...`, which is the test proving a non-tracker is not \
reported. The subject is output generated in the same test.
"""
review_by = "2026-12-31"

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/test_scanner.py"
where = "test_scanner.py:132, 135, 138 — membership in TRACKER_DOMAINS"
why = """
Three assertions that a well-known tracker is in the built-in domain list: \
`assert "facebook.com" in TRACKER_DOMAINS`. TRACKER_DOMAINS is a collection, so \
this is a membership test and not a substring test at all — the rule cannot tell \
the two apart. The real matching against that list is scanner.py:237, which is \
suffix-based.
"""
review_by = "2026-12-31"

# ─────────────────────────────────────────────────────────────────────────────
# Arrived on 2026-09-30, after 2026.41 was prepared: two advisories published
# overnight against the base image, which the gate refused before the tag. That
# is the gate working — not a defect introduced here — and the two were in
# different situations, read out of the Debian security tracker with
# `patchradar debian` rather than from the scanners' one-line summaries.
#
# The openssl one, CVE-2026-84782, was never an acceptance but a rebuild, and the
# rebuild happened: GitHub closed it at 2026-09-30T18:32:11Z, this repository's
# republish, and the entry was removed on 2026-10-02. Its return would mean the
# `apt-get upgrade` stopped taking, which is worth a build failing over. The gcc
# one, CVE-2026-102010, is below with CVE-2026-95619, which followed on
# 2026-10-02. Until 2026-11-02 each had a second entry under Snyk's id
# (SNYK-DEBIAN13-GCC14-20335537, -20386241); Snyk was retired that day, and what
# those entries said lives on in the Docker Scout entries below.
#
# Positions read with `patchradar debian` rather than from the scanners' one line:
# CVE-2026-102010 and CVE-2026-95619 are both open in trixie for gcc-12 (12.4.0-5)
# and gcc-14 (14.2.0-19), with no fixed version in any suite and no Debian bug
# recorded. Nothing to wait for and nothing to ask for; evidence goes on the
# tracker page.
#
# What the scanners name is the *source* package gcc-14, and Debian's gcc source produces
# both the compiler and libstdc++6. A flaw in cc1 needs something to compile and
# nothing in this image compiles anything; which binary package is installed is a
# measurement and not an assumption, which is why tests/docker/inspect.sh prints
# the gcc and libstdc++ packages.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-102010"
source = "Docker Scout"
where = "gcc-14 / libstdc++6 14.2.0-19, python slim-trixie base image"
why = """
Open in trixie for gcc-12 (12.4.0-5) and gcc-14 (14.2.0-19), no fixed version in \
any suite, no Debian bug — `patchradar debian CVE-2026-102010`. Evidence goes on \
https://security-tracker.debian.org/tracker/CVE-2026-102010.

Nor is it removable. The scanners name the source package `gcc-14`, and what is \
actually installed is `libstdc++6`, the C++ runtime that a long list of packages \
in the base image link against. Removing it is not an option the way the full \
`perl` would have been. Recorded under Snyk's id SNYK-DEBIAN13-GCC14-20335537 \
too, until Snyk was retired on 2026-11-02.

Since 2026-10-07T20:10:11Z Docker Scout has stopped reporting it, which is why \
the gate lists this entry as settled. It is kept, and the reason is not how long \
the silence has lasted: `patchradar debian CVE-2026-102010` on 2026-10-15 still \
reports gcc-14 no-dsa in trixie at 14.2.0-19, with the fix only in sid \
(14.4.0-3). The package named in `where` is still unfixed in trixie and only the \
reporting changed. Deleting a flaw that is demonstrably present because a \
scanner fell silent is the one direction this file must not drift in.
"""
review_by = "2026-12-31"

