# Findings that are open, known, and accepted for now — each with a reason and a
# date. `.github/workflows/security-posture.yml` reads this file: an open high or
# critical alert with no entry here fails the build, an entry past its
# `review_by` fails the build, and an entry that no longer matches anything fails
# the build too, so the record cannot drift away from the product.
#
# The rule this file exists to serve: block on everything we can fix, never block
# on an upstream flaw with no fix available — but write down why, and when that
# will be looked at again.
#
# Fields: id, where, why, review_by are required. `source` narrows an entry to one
# scanner; `path` narrows it to one file, which matters for a rule that can fire
# anywhere — an entry for a CodeQL rule without a path would excuse the next real
# occurrence of it somewhere else.
#
# Written on 2026-09-29 against the twenty-five blocking alerts GitHub then held
# for this repository. It is the longest of the five records, and for a reason
# worth stating: this image runs a real browser. `playwright install-deps
# chromium` pulls in libxml2, cups and expat, which the other Radar do not carry
# at all. Auditing cookies means loading pages, and loading pages means Chromium.
#
# Every Debian position below was read out of the security tracker with
# `patchradar debian` rather than inferred from a scanner's one-line summary, and
# the result changed what these entries say.

# ─────────────────────────────────────────────────────────────────────────────
# Chromium's system dependencies, and the one category where chasing Debian ends
# somewhere: `fix-elsewhere`. libxml2, cups and expat are all fixed in unstable
# and forky and open in trixie, with no `no-dsa` — that is, nobody has decided
# against a stable update, it simply has not happened.
#
# That makes these ten the only findings across the five Radar where there is
# something concrete to ask for, and the Debian bugs to ask on are 1146744
# (libxml2), 1132716 (cups) and 1148665 (expat). They are not "wait and hope";
# they are a stable-update request with a version number already attached.
#
#   libxml2  trixie 2.12.7+dfsg+really2.9.14-2.1+deb13u3 → sid 2.15.4+dfsg-1
#   cups     trixie 2.4.10-3+deb13u2                     → sid 2.4.17-1
#   expat    trixie 2.8.3-1~deb13u1                      → sid 2.8.4-2
#
# The dates are short on purpose. A fix that exists should not sit behind a
# year-long acceptance.
# ─────────────────────────────────────────────────────────────────────────────

