date is when to look at whether it has.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-9538"
source = "Trivy"
where = "perl 5.40.1-6+deb13u1 (perl-base), python slim-trixie base image"
why = """
A crafted file can crash perl — a denial of service (Ubuntu USN-8684-1, which \
fixes it; BellSoft fixes it in 5.40.4). Trixie has no fix per Trivy.

perl-base is Essential in Debian — dpkg depends on it — and cannot be removed; \
cookieradar is Python and never runs perl. Like every finding in this block, it waits for Debian: `apt-get upgrade` runs at \
build time, so the release after Debian ships a fix carries it, and the review \
date is when to look at whether it has.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-119373"
source = "Trivy"
where = "sqlite3 3.46.1-7+deb13u2 (libsqlite3-0), python slim-trixie base image"
why = """
SQLite before 3.54.0: an FTS5 heap buffer overflow in fts5MergeRowidLists() (OSV, 2026-11-02). One of the eleven sqlite3 \
issues the Debian package tracker lists as open in both trixie and sid, so there is \
no fixed version in any suite yet; the +deb13u2 in the image did not close it. \
Docker Scout reports it too (below).

libsqlite3-0 is in the image as a dependency of util-linux (liblastlog2-2) and of \
Python's own sqlite3 module; no module of cookieradar imports sqlite3 (its source tree, \
checked on 2026-11-02). It waits for Debian, and the release after Debian \
ships a fix carries it.
"""
review_by = "2026-12-31"

