[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cookieradar"
dynamic = ["version"]
description = "Cookie compliance auditor — GDPR art.5/6/7 — pre-consent, post-reject, GTM analysis"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Massimo Moretti", email = "massimo.moretti@maksimtech.com"}
]
keywords = ["gdpr", "cookie", "compliance", "privacy", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "playwright>=1.40.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
cookieradar = "cookieradar.cli:app"

[tool.hatch.version]
path = "cookieradar/__init__.py"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
